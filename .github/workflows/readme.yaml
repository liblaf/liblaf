name: README

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  gen-readme:
    name: README
    permissions:
      contents: write
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-readme
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          token: ${{ secrets.PAT || github.token }}
      - name: Setup uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
      - name: Install Prettier
        run: npm install --global prettier
      - name: Generate README
        run: ./scripts/gen-readme.sh
        env:
          GITHUB_TOKEN: ${{ secrets.PAT || github.token }}
      - name: Commit
        uses: stefanzweifel/git-auto-commit-action@4a55954c782fc1ea30b9056cd3e7a2b40ca8887d # v7
        with:
          commit_message: "chore: update `README.md`"
